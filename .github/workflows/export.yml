name: Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.FCStd"
      - "*.py"
      - "PLAN.md"
      - ".github/workflows/export.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up FreeCAD 1.1.3 (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: freecad
          create-args: freecad=1.1.3
          cache-downloads: true

      - name: Verify fixtures
        shell: micromamba-shell
        run: |
          set +e
          fc=$(command -v freecadcmd || command -v FreeCADCmd)
          echo "using: ${fc:-NONE}"
          ls -l "$CONDA_PREFIX/bin" | grep -i freecad || true
          "$fc" --version 2>&1 | tail -2
          "$fc" -c "exec(open('verify_fixture.py').read())" > verify.log 2>&1
          rc=$?
          tail -n 60 verify.log
          echo "VERIFY_RC=$rc" > /tmp/verify_rc.txt
          set -e
          exit $rc

      - name: Export prints + preview
        shell: micromamba-shell
        run: |
          set +e
          fc=$(command -v freecadcmd || command -v FreeCADCmd)
          "$fc" -c "exec(open('export_qdn.py').read())" > export.log 2>&1
          rc=$?
          tail -n 60 export.log
          echo "EXPORT_RC=$rc" > /tmp/export_rc.txt
          set -e
          exit $rc

      - name: Publish diagnostics
        if: always()
        shell: bash -e {0}
        run: |
          {
            echo '### verify.log (tail)'
            echo '```'
            tail -n 40 verify.log 2>/dev/null || echo 'no verify.log'
            echo '```'
            echo '### export.log (tail)'
            echo '```'
            tail -n 40 export.log 2>/dev/null || echo 'no export.log'
            echo '```'
            echo "VERIFY_RC=$(cat /tmp/verify_rc.txt 2>/dev/null || echo n/a)"
            echo "EXPORT_RC=$(cat /tmp/export_rc.txt 2>/dev/null || echo n/a)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exports artifact
        uses: actions/upload-artifact@v4
        with:
          name: exports
          path: exports

      - name: Commit exports back to the repo
        shell: bash -e {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports
          if ! git diff --cached --quiet; then
            git commit -m "chore(exports): regenerate prints + preview"
            git push
          else
            echo "exports up to date - nothing to commit"
          fi